<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#131110;color:#f0ece8;font-size:13px;line-height:1.5;padding:20px;-webkit-font-smoothing:antialiased}
</style></head><body>
<style>
.section{margin-bottom:20px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a4642;margin-bottom:10px}
.sp-row{display:flex;align-items:flex-end;gap:12px}
.sp-box{background:#272422;border:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sp-lbl{font-family:'Chivo Mono',monospace;font-size:9px;color:#4a4642;text-align:center;margin-top:5px}
.r-row{display:flex;gap:10px;align-items:center}
.r-box{background:#272422;border:1px solid rgba(255,255,255,.12);width:56px;height:38px;flex-shrink:0}
</style>
<div class="section">
  <div class="lbl">Spacing scale</div>
  <div class="sp-row">
    <div><div class="sp-box" style="width:4px;height:4px"></div><div class="sp-lbl">sp-1
4px</div></div><div><div class="sp-box" style="width:8px;height:8px"></div><div class="sp-lbl">sp-2
8px</div></div><div><div class="sp-box" style="width:12px;height:12px"></div><div class="sp-lbl">sp-3
12px</div></div><div><div class="sp-box" style="width:16px;height:16px"></div><div class="sp-lbl">sp-4
16px</div></div><div><div class="sp-box" style="width:20px;height:20px"></div><div class="sp-lbl">sp-5
20px</div></div><div><div class="sp-box" style="width:24px;height:24px"></div><div class="sp-lbl">sp-6
24px</div></div><div><div class="sp-box" style="width:28px;height:28px"></div><div class="sp-lbl">sp-7
28px</div></div><div><div class="sp-box" style="width:32px;height:32px"></div><div class="sp-lbl">sp-8
32px</div></div>
  </div>
</div>
<div class="section">
  <div class="lbl">Border radii</div>
  <div class="r-row">
    <div><div class="r-box" style="border-radius:4px"></div><div class="sp-lbl">4px
sm·chip</div></div><div><div class="r-box" style="border-radius:7px"></div><div class="sp-lbl">7px
md·btn</div></div><div><div class="r-box" style="border-radius:10px"></div><div class="sp-lbl">10px
lg·card</div></div><div><div class="r-box" style="border-radius:20px"></div><div class="sp-lbl">20px
pill</div></div>
    <div><div style="width:56px;height:38px;border-radius:50%;background:#272422;border:1px solid rgba(255,255,255,.12)"></div><div class="sp-lbl">50%
avatar</div></div>
  </div>
</div>
</body></html>
