<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#131110;color:#f0ece8;font-size:13px;line-height:1.5;padding:20px;-webkit-font-smoothing:antialiased}
</style></head><body>
<style>
.hd{display:flex;align-items:flex-start;justify-content:space-between;border-left:3px solid #9b7fff;padding-left:16px;margin-bottom:22px}
.name{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.real{font-size:15px;color:#7c7870;margin-top:4px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.since{font-size:12px;color:#7c7870}
.id{font-family:'Chivo Mono',monospace;font-size:11px;color:#4a4642}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;border:1px solid;font-size:13px;font-weight:600}
.tag-since{font-size:11px;font-weight:400;opacity:.65}
.add{background:none;border:1px dashed rgba(255,255,255,.12);color:#7c7870;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer}
</style>
<div class="hd">
  <div>
    <div class="name">Klaas</div>
    <div class="real">Klaas de Beer</div>
  </div>
  <div class="meta">
    <span class="since">member since 1-9-2017</span>
    <span class="id">#1</span>
  </div>
</div>
<div class="tags">
  <div class="tag" style="color:#9b7fff;border-color:#9b7fff45;background:#9b7fff12"><span>board</span><span class="tag-since">since 1-9-2019</span></div>
  <div class="tag" style="color:#00c4a0;border-color:#00c4a045;background:#00c4a012"><span>member</span><span class="tag-since">since 1-9-2017</span></div>
  <div class="tag" style="color:#4db6ff;border-color:#4db6ff45;background:#4db6ff12"><span>nerd</span><span class="tag-since">since 15-12-2021</span></div>
  <button class="add">+ add role</button>
</div>
</body></html>
