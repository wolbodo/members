<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#131110;color:#f0ece8;font-size:13px;line-height:1.5;padding:20px;-webkit-font-smoothing:antialiased}
</style></head><body>
<style>
.header{height:54px;display:flex;align-items:center;padding:0 24px;background:rgba(16,15,13,.97);border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:20px;gap:0}
.brand{display:flex;align-items:center;gap:9px;margin-right:32px}
.wm{color:#00c4a0}
.ww{font-size:16px;font-weight:700;letter-spacing:-.02em}
.ww em{color:#00c4a0;font-style:normal}
.nav{display:flex;gap:2px;flex:1}
.nl{font-size:13px;font-weight:500;color:#7c7870;padding:5px 12px;border:none;background:none;cursor:pointer;border-radius:6px;position:relative}
.nl.active{color:#f0ece8;font-weight:600}
.nl.active::after{content:'';position:absolute;bottom:-1px;left:12px;right:12px;height:2px;background:#00c4a0;border-radius:2px 2px 0 0}
.uc{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border-radius:20px;border:1px solid rgba(255,255,255,.07);margin-left:auto}
.av{width:26px;height:26px;border-radius:50%;background:rgba(0,196,160,.35);color:#00c4a0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.un{font-size:13px;font-weight:500}
.tabs{display:flex;gap:2px;border-bottom:1px solid rgba(255,255,255,.07)}
.tab{font-size:14px;font-weight:500;color:#7c7870;padding:8px 16px;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.tab.active{color:#f0ece8;font-weight:700;border-bottom-color:#00c4a0}
.tc{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:#7c7870}
.tab.active .tc{background:rgba(0,196,160,.35);color:#00c4a0}
</style>
<div class="header">
  <div class="brand">
    <svg class="wm" width="18" height="14" viewBox="0 0 22 17" fill="none"><path d="M1.5 2.5L5.5 14.5L11 5.5L16.5 14.5L20.5 2.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="ww">wolbodo <em>members</em></span>
  </div>
  <div class="nav">
    <button class="nl active">Members</button>
    <button class="nl">Mail</button>
    <button class="nl">Changes</button>
  </div>
  <div class="uc">
    <div class="av">K</div>
    <span class="un">Klaas</span>
  </div>
</div>
<div class="tabs">
  <button class="tab active">Members <span class="tc">18</span></button>
  <button class="tab">Everyone <span class="tc">22</span></button>
</div>
</body></html>
