<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#131110;color:#f0ece8;font-size:13px;line-height:1.5;padding:20px;-webkit-font-smoothing:antialiased}
</style></head><body>
<style>
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px;align-items:center}
.sw-block{width:72px;height:72px;border-radius:8px;border:1px solid rgba(255,255,255,.08)}
.sw-label{font-size:10px;color:#7c7870;text-align:center;line-height:1.3}
.sw-hex{font-family:'Chivo Mono',monospace;font-size:9px;color:#4a4642}
.group{margin-bottom:18px}
.group-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a4642;margin-bottom:10px}
</style>
<div class="group">
  <div class="group-lbl">Backgrounds</div>
  <div class="swatches">
    
    <div class="sw"><div class="sw-block" style="background:#131110"></div><div class="sw-label">bg</div><div class="sw-hex">#131110</div></div>
    <div class="sw"><div class="sw-block" style="background:#1e1c1a"></div><div class="sw-label">bg-s</div><div class="sw-hex">#1e1c1a</div></div>
    <div class="sw"><div class="sw-block" style="background:#272422"></div><div class="sw-label">bg-c</div><div class="sw-hex">#272422</div></div>
    <div class="sw"><div class="sw-block" style="background:#302d2a"></div><div class="sw-label">bg-h</div><div class="sw-hex">#302d2a</div></div>
  </div>
</div>
<div class="group">
  <div class="group-lbl">Primary · Text · Semantic</div>
  <div class="swatches">
    
    <div class="sw"><div class="sw-block" style="background:#00c4a0"></div><div class="sw-label">primary</div><div class="sw-hex">#00c4a0</div></div>
    <div class="sw"><div class="sw-block" style="background:#f0ece8"></div><div class="sw-label">txt</div><div class="sw-hex">#f0ece8</div></div>
    <div class="sw"><div class="sw-block" style="background:#7c7870"></div><div class="sw-label">txt2</div><div class="sw-hex">#7c7870</div></div>
    <div class="sw"><div class="sw-block" style="background:#4a4642"></div><div class="sw-label">txt3</div><div class="sw-hex">#4a4642</div></div>
    <div class="sw"><div class="sw-block" style="background:#e05555"></div><div class="sw-label">red</div><div class="sw-hex">#e05555</div></div>
    <div class="sw"><div class="sw-block" style="background:#00c46a"></div><div class="sw-label">green</div><div class="sw-hex">#00c46a</div></div>
    <div class="sw"><div class="sw-block" style="background:#e8a150"></div><div class="sw-label">amber</div><div class="sw-hex">#e8a150</div></div>
    <div class="sw"><div class="sw-block" style="background:#9b7fff"></div><div class="sw-label">purple</div><div class="sw-hex">#9b7fff</div></div>
  </div>
</div>
</body></html>
