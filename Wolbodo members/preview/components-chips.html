<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#131110;color:#f0ece8;font-size:13px;line-height:1.5;padding:20px;-webkit-font-smoothing:antialiased}
</style></head><body>
<style>
.section{margin-bottom:20px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a4642;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;border:1px solid;font-size:13px;font-weight:600}
.tag-since{font-size:11px;font-weight:400;opacity:.65}
.add-btn{background:none;border:1px dashed rgba(255,255,255,.12);color:#7c7870;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border:1px solid}
.more{font-size:10px;font-weight:700;color:#7c7870;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.07)}
</style>
<div class="section">
  <div class="lbl">Role chips — table</div>
  <div class="row">
    <span class="chip" style="color:#00c4a0;border-color:#00c4a050;background:#00c4a014">member</span><span class="chip" style="color:#9b7fff;border-color:#9b7fff50;background:#9b7fff14">board</span><span class="chip" style="color:#4db6ff;border-color:#4db6ff50;background:#4db6ff14">nerd</span><span class="chip" style="color:#e8a150;border-color:#e8a15050;background:#e8a15014">muzikant</span><span class="chip" style="color:#e05593;border-color:#e0559350;background:#e0559314">im</span>
    <span class="more">+2</span>
  </div>
</div>
<div class="section">
  <div class="lbl">Role tags — profile</div>
  <div class="row">
    <div class="tag" style="color:#00c4a0;border-color:#00c4a045;background:#00c4a012"><span>member</span><span class="tag-since">since 1-9-2017</span></div><div class="tag" style="color:#9b7fff;border-color:#9b7fff45;background:#9b7fff12"><span>board</span><span class="tag-since">since 1-9-2019</span></div><div class="tag" style="color:#4db6ff;border-color:#4db6ff45;background:#4db6ff12"><span>nerd</span><span class="tag-since">since 15-12-2021</span></div>
    <button class="add-btn">+ add role</button>
  </div>
</div>
<div class="section">
  <div class="lbl">Status badges</div>
  <div class="row">
    <span class="badge" style="color:#00c46a;background:rgba(0,196,106,.1);border-color:rgba(0,196,106,.3)">sent</span>
    <span class="badge" style="color:#e8a150;background:rgba(232,161,80,.1);border-color:rgba(232,161,80,.3)">pending</span>
  </div>
</div>
</body></html>
