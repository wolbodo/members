<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#131110;color:#f0ece8;font-size:13px;line-height:1.5;padding:20px;-webkit-font-smoothing:antialiased}
</style></head><body>
<style>
.roles{display:flex;gap:8px;flex-wrap:wrap}
.role{display:flex;flex-direction:column;align-items:center;gap:5px}
.role-swatch{width:56px;height:56px;border-radius:8px}
.role-name{font-size:10px;color:#7c7870}
.role-hex{font-family:'Chivo Mono',monospace;font-size:9px;color:#4a4642}
.chip{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid;margin-top:3px}
</style>
<div class="roles">
  
  <div class="role">
    <div class="role-swatch" style="background:#00c4a018;border:1px solid #00c4a044"></div>
    <span class="chip" style="color:#00c4a0;border-color:#00c4a050;background:#00c4a014">member</span>
    <div class="role-hex">#00c4a0</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#9b7fff18;border:1px solid #9b7fff44"></div>
    <span class="chip" style="color:#9b7fff;border-color:#9b7fff50;background:#9b7fff14">board</span>
    <div class="role-hex">#9b7fff</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#4db6ff18;border:1px solid #4db6ff44"></div>
    <span class="chip" style="color:#4db6ff;border-color:#4db6ff50;background:#4db6ff14">nerd</span>
    <div class="role-hex">#4db6ff</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#e8a15018;border:1px solid #e8a15044"></div>
    <span class="chip" style="color:#e8a150;border-color:#e8a15050;background:#e8a15014">muzikant</span>
    <div class="role-hex">#e8a150</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#e0559318;border:1px solid #e0559344"></div>
    <span class="chip" style="color:#e05593;border-color:#e0559350;background:#e0559314">im</span>
    <div class="role-hex">#e05593</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#b5cc3a18;border:1px solid #b5cc3a44"></div>
    <span class="chip" style="color:#b5cc3a;border-color:#b5cc3a50;background:#b5cc3a14">klusser</span>
    <div class="role-hex">#b5cc3a</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#ff6b6b18;border:1px solid #ff6b6b44"></div>
    <span class="chip" style="color:#ff6b6b;border-color:#ff6b6b50;background:#ff6b6b14">wolpop</span>
    <div class="role-hex">#ff6b6b</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#6bc5ff18;border:1px solid #6bc5ff44"></div>
    <span class="chip" style="color:#6bc5ff;border-color:#6bc5ff50;background:#6bc5ff14">schoonmaker</span>
    <div class="role-hex">#6bc5ff</div>
  </div>
  <div class="role">
    <div class="role-swatch" style="background:#aaa88818;border:1px solid #aaa88844"></div>
    <span class="chip" style="color:#aaa888;border-color:#aaa88850;background:#aaa88814">server</span>
    <div class="role-hex">#aaa888</div>
  </div>
</div>
</body></html>
