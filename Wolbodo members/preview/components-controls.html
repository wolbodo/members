<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#131110;color:#f0ece8;font-size:13px;line-height:1.5;padding:20px;-webkit-font-smoothing:antialiased}
</style></head><body>
<style>
.section{margin-bottom:22px}
.lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4a4642;margin-bottom:12px}
.row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:8px}
.track{width:34px;height:19px;border-radius:10px;background:#272422;border:1px solid rgba(255,255,255,.12);position:relative}
.track.on{background:#00c4a0;border-color:#00c4a0}
.thumb{width:13px;height:13px;border-radius:50%;background:#7c7870;position:absolute;top:2px;left:2px;transition:all .2s}
.track.on .thumb{transform:translateX(15px);background:#111}
.tl{font-size:12px;font-weight:500;color:#7c7870}
.tl.on{color:#f0ece8}
.uc{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 5px;border-radius:20px;border:1px solid rgba(255,255,255,.07)}
.av{width:26px;height:26px;border-radius:50%;background:rgba(0,196,160,.35);color:#00c4a0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.dd{background:#272422;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:5px;min-width:150px;box-shadow:0 8px 28px rgba(0,0,0,.5);margin-top:6px}
.dd button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:none;color:#f0ece8;font-size:13px;cursor:pointer;border-radius:6px;font-family:'Outfit',sans-serif}
.dd button.danger{color:#e05555}
.dd hr{border:none;border-top:1px solid rgba(255,255,255,.07);margin:4px 0}
.pill{font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:none;color:#7c7870;cursor:pointer}
.pill.active{color:#00c4a0;border-color:#00c4a060;background:#00c4a014}
</style>
<div class="section">
  <div class="lbl">Toggles</div>
  <div class="row">
    <div class="tog"><div class="track"><div class="thumb"></div></div><span class="tl">Allow register</span></div>
    <div class="tog"><div class="track on"><div class="thumb"></div></div><span class="tl on">Allow door</span></div>
  </div>
</div>
<div class="section">
  <div class="lbl">Filter pills</div>
  <div class="row">
    <button class="pill active">member</button>
    <button class="pill">board</button>
    <button class="pill">nerd</button>
    <button class="pill">muzikant</button>
  </div>
</div>
<div class="section">
  <div class="lbl">User chip + dropdown</div>
  <div style="display:flex;gap:20px;align-items:flex-start">
    <div class="uc"><div class="av">K</div><span style="font-size:13px;font-weight:500">Klaas</span></div>
    <div class="dd">
      <button>My profile</button>
      <hr>
      <button class="danger">Log out</button>
    </div>
  </div>
</div>
</body></html>
