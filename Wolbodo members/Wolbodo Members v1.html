<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolbodo Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ═══ TOKENS ══════════════════════════════════════════════════════════════ */
:root {
  --bg:            #0c1513;
  --bg-surface:    #101e1b;
  --bg-elevated:   #152421;
  --bg-hover:      #1b2e2a;
  --border:        rgba(0,196,160,.13);
  --border-mid:    rgba(0,196,160,.22);
  --border-bright: rgba(0,196,160,.38);
  --primary:       #00c4a0;
  --primary-glow:  rgba(0,196,160,.12);
  --primary-border:rgba(0,196,160,.38);
  --accent:        #e8a150;
  --purple:        #9b7fff;
  --red:           #e05555;
  --green:         #00c46a;
  --text:          #c4e8e3;
  --text-2:        #5a9a8a;
  --text-3:        #2e6060;
  --mono:          'Space Mono', 'Courier New', monospace;
  --display:       'Syne', sans-serif;
}
[data-density="compact"] .wb-table td { padding: 6px 14px; }
[data-density="compact"] .role-row    { padding: 7px 12px; }

/* ═══ RESET ══════════════════════════════════════════════════════════════ */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.55;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 40% at 20% -10%, rgba(0,196,160,.05) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 110%,  rgba(155,127,255,.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
#root { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

/* ═══ HEADER ═════════════════════════════════════════════════════════════ */
.app-header {
  position: sticky; top: 0; z-index: 200;
  height: 52px;
  background: rgba(10,20,18,.96);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 0;
  box-shadow: 0 1px 24px rgba(0,0,0,.5);
}
.header-brand {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; margin-right: 28px; flex-shrink: 0;
  text-decoration: none;
}
.header-wmark { color: var(--primary); display: flex; align-items: center; }
.header-wordmark {
  font-family: var(--display); font-weight: 800; font-size: 17px;
  color: var(--text); letter-spacing: -.02em;
}
.header-wordmark em { color: var(--primary); font-style: normal; }
.header-nav { display: flex; align-items: center; gap: 2px; flex: 1; }
.nav-link {
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-2); padding: 6px 11px;
  border: none; background: none; cursor: pointer;
  border-radius: 5px; transition: color .15s, background .15s;
  position: relative;
}
.nav-link:hover { color: var(--text); background: var(--primary-glow); }
.nav-link.active { color: var(--primary); }
.nav-link.active::after {
  content: '';
  position: absolute; bottom: -1px; left: 50%;
  transform: translateX(-50%);
  width: 18px; height: 2px;
  background: var(--primary); border-radius: 2px 2px 0 0;
}
.nav-self { margin-left: 6px; }
.nav-logout { margin-left: auto; color: var(--text-3); }
.nav-logout:hover { color: var(--red); background: rgba(224,85,85,.08); }

/* ═══ SEARCH ═════════════════════════════════════════════════════════════ */
.search-btn {
  width: 32px; height: 32px; border-radius: 6px;
  border: 1px solid var(--border); background: none;
  color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; margin-left: 8px;
}
.search-btn:hover { color: var(--primary); border-color: var(--border-bright); background: var(--primary-glow); }
.search-open {
  display: flex; align-items: center; gap: 7px;
  background: var(--bg-surface); border: 1px solid var(--border-bright);
  border-radius: 6px; padding: 0 10px; height: 32px;
  width: 240px; margin-left: 8px;
  animation: searchIn .18s ease;
}
@keyframes searchIn { from { width: 36px; opacity: 0; } to { width: 240px; opacity: 1; } }
.search-open-icon { color: var(--text-3); flex-shrink: 0; display: flex; }
.search-open-input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: var(--mono); font-size: 12px;
  caret-color: var(--primary);
}
.search-open-input::placeholder { color: var(--text-3); }
.search-clear-btn {
  background: none; border: none; color: var(--text-3);
  cursor: pointer; font-size: 18px; padding: 0; line-height: 1;
  transition: color .15s;
}
.search-clear-btn:hover { color: var(--text); }

/* ═══ LAYOUT ════════════════════════════════════════════════════════════ */
.app-root { display: flex; flex-direction: column; min-height: 100vh; }
.app-main { flex: 1; padding: 32px 28px; max-width: 1240px; width: 100%; margin: 0 auto; }
.page { animation: pageIn .17s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.page-title-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
.page-title { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.025em; }
.page-count { font-size: 11px; color: var(--text-3); }

/* ═══ TABLES ═════════════════════════════════════════════════════════════ */
.table-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.wb-table { width: 100%; border-collapse: collapse; }
.wb-table thead th {
  background: var(--bg-surface);
  color: var(--text-2); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 10px 14px; text-align: left;
  border-bottom: 1px solid var(--border);
}
.wb-table tbody tr { border-bottom: 1px solid var(--border); }
.wb-table tbody tr:last-child { border-bottom: none; }
.tr-clickable { cursor: pointer; transition: background .1s; }
.tr-clickable:hover { background: var(--bg-hover); box-shadow: inset 3px 0 0 var(--primary); }
.wb-table td { padding: 10px 14px; font-size: 12px; vertical-align: middle; }
.td-name { color: var(--primary); font-weight: 700; }
.td-dim  { color: var(--text-2); }
.td-roles { display: flex; flex-wrap: wrap; gap: 4px; }

/* ═══ ROLE CHIPS ═════════════════════════════════════════════════════════ */
.role-chip {
  display: inline-block; padding: 2px 7px; border-radius: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: .05em;
  border: 1px solid; white-space: nowrap;
}

/* ═══ BUTTONS ════════════════════════════════════════════════════════════ */
.btn {
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 5px; border: none;
  cursor: pointer; transition: all .15s;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #0c1513; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.12); box-shadow: 0 0 14px var(--primary-glow); }
.btn-outline {
  background: none; color: var(--text-2);
  border: 1px solid var(--border-mid);
}
.btn-outline:hover { color: var(--text); border-color: var(--border-bright); background: var(--primary-glow); }
.btn-ghost-sm {
  background: none; border: none; color: var(--text-2);
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: .06em; cursor: pointer; padding: 4px 0;
  display: inline-flex; align-items: center; gap: 5px;
  transition: color .15s;
}
.btn-ghost-sm:hover { color: var(--primary); }
.btn-stop {
  background: rgba(224,85,85,.12); color: var(--red);
  border: 1px solid rgba(224,85,85,.28);
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 4px; cursor: pointer;
  transition: all .15s;
}
.btn-stop:hover { background: rgba(224,85,85,.22); }
.btn-icon {
  width: 36px; height: 36px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 15px; cursor: pointer;
  border: 1px solid var(--border-mid); background: none; transition: all .15s;
}
.btn-edit        { color: var(--text-2); }
.btn-edit:hover  { color: var(--primary); border-color: var(--border-bright); background: var(--primary-glow); }
.btn-edit-active { color: var(--red); border-color: rgba(224,85,85,.35); background: rgba(224,85,85,.1); }
.btn-edit-active:hover { background: rgba(224,85,85,.2); }

/* ═══ TOGGLE ═════════════════════════════════════════════════════════════ */
.wb-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.toggle-track {
  width: 34px; height: 19px; border-radius: 10px;
  background: var(--bg-elevated); border: 1px solid var(--border-mid);
  position: relative; transition: all .2s; flex-shrink: 0;
}
.toggle-track.on { background: var(--primary); border-color: var(--primary); }
.toggle-thumb {
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--text-2); position: absolute; top: 2px; left: 2px;
  transition: all .2s;
}
.toggle-track.on .toggle-thumb { transform: translateX(15px); background: #0c1513; }
.toggle-label { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-2); }
.toggle-label.on { color: var(--text); }

/* ═══ FORM FIELDS ════════════════════════════════════════════════════════ */
.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-label {
  font-size: 9px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-2);
}
.field-value { font-size: 13px; color: var(--text); padding: 2px 0; min-height: 22px; }
.dim-dash { color: var(--text-3); }
.field-input {
  background: var(--bg-surface); border: 1px solid var(--border-mid);
  border-radius: 5px; padding: 8px 10px;
  color: var(--text); font-family: var(--mono); font-size: 12px;
  outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
}
.field-input:focus { border-color: var(--border-bright); box-shadow: 0 0 0 2px var(--primary-glow); }
.field-input::placeholder { color: var(--text-3); }
.field-input.changed { border-color: rgba(232,161,80,.5); background: rgba(232,161,80,.06); }
textarea.field-input { resize: vertical; min-height: 72px; }

/* ═══ FORM GRID ══════════════════════════════════════════════════════════ */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.toggles-row { display: flex; flex-direction: row; align-items: flex-start; gap: 28px; flex-wrap: wrap; padding: 8px 0; }
.toggles-row .wb-toggle { margin-top: 6px; }

/* ═══ LIST CONTROLS ══════════════════════════════════════════════════════ */
.list-controls { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.list-count { font-size: 11px; color: var(--text-3); margin-left: auto; }

/* ═══ PROFILE ════════════════════════════════════════════════════════════ */
.profile-back-row { margin-bottom: 20px; }
.profile-name-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
.profile-name { font-family: var(--display); font-weight: 800; font-size: 42px; letter-spacing: -.035em; line-height: 1; color: var(--text); }
.profile-fullname { display: block; font-family: var(--mono); font-size: 14px; font-weight: 400; color: var(--text-2); margin-top: 5px; }
.section-divider { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
.section-heading { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); margin-bottom: 14px; }
.add-role-row { display: flex; gap: 8px; margin-bottom: 12px; }
.add-role-row .field-input { flex: 1; }
.roles-list { display: flex; flex-direction: column; gap: 6px; }
.no-roles { font-size: 12px; color: var(--text-3); font-style: italic; }
.role-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--bg-surface);
  border: 1px solid var(--border); border-radius: 6px;
}
.role-row-left { display: flex; align-items: center; gap: 12px; }
.role-row-chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 4px; border: 1px solid; }
.role-since { font-size: 11px; color: var(--text-2); }
.past-roles-block { margin-top: 16px; }
.past-role-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 14px; border-radius: 4px; opacity: .5;
}
.past-role-dates { font-size: 11px; color: var(--text-3); }
.meta-footer { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.meta-id { color: var(--primary); opacity: .7; font-weight: 700; font-size: 12px; }
.meta-footer span { font-size: 11px; color: var(--text-3); }
.profile-submit-row { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 28px; }
.flash-msg { font-size: 11px; color: var(--green); }

/* ═══ CHANGES ════════════════════════════════════════════════════════════ */
.changes-table .ch-time { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ch-line { font-size: 11px; line-height: 1.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
.ch-field { color: var(--text-2); }
.ch-old   { color: var(--red); opacity: .8; }
.ch-arrow { color: var(--text-3); }
.ch-new   { color: var(--primary); }
.ch-null  { color: var(--text-3); font-style: italic; }
.ch-pass  { color: var(--text-3); letter-spacing: .2em; }

/* ═══ MAIL ═══════════════════════════════════════════════════════════════ */
.status-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border: 1px solid;
}
.status-sent    { color: var(--green); background: rgba(0,196,106,.1); border-color: rgba(0,196,106,.25); }
.status-pending { color: var(--accent); background: rgba(232,161,80,.1); border-color: rgba(232,161,80,.25); }

/* ═══ LOGIN ══════════════════════════════════════════════════════════════ */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 360px; }
.login-logo { text-align: center; margin-bottom: 32px; }
.login-wmark { color: var(--primary); display: inline-block; margin-bottom: 10px; }
.login-title {
  font-family: var(--display); font-weight: 800; font-size: 22px;
  letter-spacing: -.02em; color: var(--text);
}
.login-title span { color: var(--primary); }
.login-form {
  background: var(--bg-surface); border: 1px solid var(--border-mid);
  border-radius: 10px; padding: 28px;
  display: flex; flex-direction: column; gap: 18px;
}
.login-error {
  font-size: 12px; color: var(--red); padding: 8px 12px;
  background: rgba(224,85,85,.08); border: 1px solid rgba(224,85,85,.22); border-radius: 5px;
}
.login-success {
  font-size: 12px; color: var(--green); padding: 10px 12px;
  background: rgba(0,196,106,.08); border: 1px solid rgba(0,196,106,.22); border-radius: 5px; line-height: 1.5;
}
.login-sub { font-size: 12px; color: var(--text-2); line-height: 1.5; }
.login-row { display: flex; align-items: center; justify-content: space-between; }

/* ═══ MISC ════════════════════════════════════════════════════════════════ */
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-2); font-size: 13px; }
a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="wb-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wb-ui.jsx"></script>
<script type="text/babel" src="wb-pages.jsx"></script>
<script type="text/babel" src="wb-app.jsx"></script>
</body>
</html>
